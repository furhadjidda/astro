name: Zephyr Firmware CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        board: [feather, rak]
        include:
          - board: feather
            micro_ros: false
            name: adafruit_feather_esp32s3/esp32s3/procpu
            overlay: boards/adafruit_feather_s3.overlay
            conf: boards/adafruit_feather_s3.conf
            sysbuild: true
            flash: espressif-flash-4M
            psram: espressif-psram-2M
          - board: rak
            micro_ros: true
            name: rak3112/esp32s3/procpu
            overlay: boards/rak_wireless_rak3312.overlay
            conf: boards/rak_wireless_rak3312.conf
            sysbuild: true
            flash: espressif-flash-16M
            psram: espressif-psram-8M

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Zephyr CI image
        run: |
          docker build \
            --file docker/dockerfile \
            --tag zephyr-dev:4.4.0 \
            docker

      - name: Initialize workspace and build Zephyr apps
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --entrypoint bash \
            --env HOME=/tmp/zephyr-home \
            --env WORKSPACE="$GITHUB_WORKSPACE" \
            --env BOARD='${{ matrix.name }}' \
            --env OVERLAY='${{ matrix.overlay }}' \
            --env CONF='${{ matrix.conf }}' \
            --env FLASH='${{ matrix.flash }}' \
            --env PSRAM='${{ matrix.psram }}' \
            --env BUILD_MICRO_ROS='${{ matrix.micro_ros }}' \
            zephyr-dev:4.4.0 \
            -euo pipefail -c '
          mkdir -p "$HOME"
          git config --global --add safe.directory "*"
          source /opt/zephyr-venv/bin/activate
          cd "$WORKSPACE/firmware/zephyr"

          if [ ! -d ".west" ]; then
            west init -l west
          fi
          west update --narrow
          west packages pip --install
          python -m pip install "setuptools<80"
          west blobs fetch hal_espressif
          west help build >/dev/null

          rm -rf build \
            astro_custom_modules/libmicroros/micro_ros_dev/build \
            astro_custom_modules/libmicroros/micro_ros_dev/install \
            astro_custom_modules/libmicroros/micro_ros_dev/log \
            astro_custom_modules/libmicroros/micro_ros_src/build \
            astro_custom_modules/libmicroros/micro_ros_src/install \
            astro_custom_modules/libmicroros/micro_ros_src/log \
            astro_custom_modules/libmicroros/micro_ros_src/libmicroros \
            astro_custom_modules/libmicroros/include
          rm -f astro_custom_modules/libmicroros/libmicroros.a \
            astro_custom_modules/libmicroros/configured_colcon.meta \
            astro_custom_modules/libmicroros/zephyr_toolchain.cmake

          west build -p always -b "$BOARD" -d build/app_sensor_node \
            --sysbuild app_sensor_node -- \
            -DDTC_OVERLAY_FILE="$OVERLAY" -DEXTRA_CONF_FILE="$CONF"

          if [ "$BUILD_MICRO_ROS" = "true" ]; then
            west build -p always -b "$BOARD" -d build/app_microros_node \
              --sysbuild app_microros_node -- \
              -DDTC_OVERLAY_FILE="$OVERLAY" -DEXTRA_CONF_FILE="$CONF"
          fi

          west build -p always -b "$BOARD" -d build/app_examples \
            -S "$FLASH" -S "$PSRAM" --sysbuild app_examples -- \
            -DDTC_OVERLAY_FILE="$OVERLAY" -DEXTRA_CONF_FILE="$CONF"
          '

