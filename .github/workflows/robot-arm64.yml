name: Robot ARM64 image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        working-directory: ros2
        run: make build

      - name: Check image and ROS packages
        shell: bash
        run: |
          test "$(docker image inspect astro:humble-arm64 --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker run --rm --platform linux/arm64 astro:humble-arm64 bash -c '
            set -e
            for package in robot_bringup astro_dynamixel_odometry sllidar_ros2 realsense2_camera micro_ros_agent astro_depthai_test; do
              ros2 pkg prefix "$package"
            done
            ros2 launch robot_bringup robot_base.launch.py --show-args
            rs-enumerate-devices --help
          '

      - name: Choose image tag
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]')
        id: image
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag="pr-${PR_NUMBER}-${GITHUB_SHA}"
          else
            tag="main-${GITHUB_SHA}"
          fi
          echo "ref=ghcr.io/${owner}/astro:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.image.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push checked image
        if: steps.image.outcome == 'success'
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker tag astro:humble-arm64 "$IMAGE_REF"
          docker push "$IMAGE_REF"
          echo "Published image: \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
