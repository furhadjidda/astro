name: Pi4 Cross-Compile CI

on:
  push:
    paths:
      - .github/workflows/pi4-cross-compile.yml
      - ros2_ws/astro.repos
      - ros2_ws/src/**
      - ros2_ws/utils/**
      - ros2_ws/target_deploy_script/**
  pull_request:
    paths:
      - .github/workflows/pi4-cross-compile.yml
      - ros2_ws/astro.repos
      - ros2_ws/src/**
      - ros2_ws/utils/**
      - ros2_ws/target_deploy_script/**
  workflow_dispatch:
  workflow_call:

jobs:
  cross_compile_pi4:
    name: Cross-compile ROS 2 workspace for Pi4 (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import repositories from astro.repos
        working-directory: ros2_ws
        run: |
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" vcstool
          .ci-venv/bin/vcs import . < astro.repos

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker and emulation
        run: |
          docker --version
          docker buildx version
          docker run --rm --platform linux/arm64 alpine:3.20 uname -m

      - name: CI diagnostics (commit + Dockerfile)
        run: |
          git rev-parse HEAD
          sed -n '1,80p' ros2_ws/target_deploy_script/Dockerfile

      - name: Cross-compile Pi4 workspace (build-only)
        working-directory: ros2_ws
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          python3 target_deploy_script/build_and_deploy_pi4.py \
            --skip-deploy \
            --first-run \
            --continue-on-error
