/oak:
  ros__parameters:
    pipeline_gen:
      i_nn_type: none
      i_enable_rgbd: true
      i_pipeline_type: rgbd
      # Keep sync enabled for stable RGBD pointcloud generation.
      i_enable_sync: true

    # Relax sync policy to reduce warning spam on USB2/HIGH links.
    sync:
      i_sync_threshold: 100
      i_sync_attempts: 120

    # Reduce frame rate to make USB2/HIGH links more stable.
    rgb:
      i_fps: 10.0
      i_width: 640
      i_height: 400
      i_synced: true

    stereo:
      i_depth_preset: DEFAULT
      i_fps: 10.0
      i_subpixel: false
      i_synced: true

    left:
      i_fps: 10.0
      i_width: 640
      i_height: 400
      i_synced: true

    right:
      i_fps: 10.0
      i_width: 640
      i_height: 400
      i_synced: true

    # Keep host-side sync on for consistent RGBD output rate.
    rgbd:
      i_publish_topic: false
      i_run_sync_on_host: true
      i_num_threads: 2
      i_max_q_size: 1
