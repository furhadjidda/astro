CONFIG_GPIO=y

# Display / OLED
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_MICROROS=y
CONFIG_MICROROS_PUBLISHERS="8"
CONFIG_MICROROS_SUBSCRIBERS="8"
CONFIG_MICROROS_CLIENTS="8"
CONFIG_MICROROS_SERVERS="8"
CONFIG_MICROROS_GUARD_CONDITIONS="8"
CONFIG_MICROROS_XRCE_DDS_HISTORIC="8"
CONFIG_MICROROS_RMW_HISTORIC="8"
CONFIG_MICROROS_XRCE_DDS_MTU="512"
CONFIG_MICROROS_TRANSPORT_UDP=y
# Wi-Fi credentials and agent address are kept out of version control.
# Set them in local.conf (see local.conf.example).

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_CPP=y

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_PICOLIBC=y
CONFIG_POSIX_API=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PICOLIBC_MODULE=y
CONFIG_STD_CPP14=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_POSIX_CLOCK_SELECTION=y
